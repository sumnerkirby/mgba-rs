[package]
name = "mgba-gui"
description = "Desktop frontend for the Rust mGBA port"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mgba-rs"
path = "src/main.rs"

[dependencies]
mgba-core = { path = "../mgba-core" }
eframe = { version = "0.37", features = ["persistence"] }
egui = { version = "0.37", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
libc = "0.2"
