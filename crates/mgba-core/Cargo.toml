[package]
name = "mgba-core"
description = "Game Boy and Game Boy Advance emulator core, ported from mGBA"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3"
# mGBA save states store their data zlib-compressed in PNG chunks.
flate2 = "1"

[dev-dependencies]
png = "0.17"
